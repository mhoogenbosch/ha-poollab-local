<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PoolLab Local">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFF"/>
      <stop offset="55%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#082F49" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- subtle water surface arcs -->
  <g stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M58 392c34-22 68-22 102 0s68 22 102 0 68-22 102 0 68 22 90 6"/>
    <path d="M58 436c34-22 68-22 102 0s68 22 102 0 68-22 102 0 68 22 90 6"/>
  </g>

  <!-- droplet -->
  <path filter="url(#soft)" fill="url(#drop)"
        d="M256 92c0 0 104 118 104 186a104 104 0 0 1-208 0C152 210 256 92 256 92z"/>

  <!-- pH marker inside the droplet -->
  <text x="256" y="316" text-anchor="middle" font-family="'DejaVu Sans',Verdana,sans-serif"
        font-size="92" font-weight="700" fill="#0C4A6E">pH</text>

  <!-- bluetooth glyph, bottom-right badge -->
  <g transform="translate(372,344)">
    <circle cx="0" cy="0" r="66" fill="#082F49"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#38BDF8" stroke-width="6"/>
    <path d="M-16 -30 L16 -8 L-16 14 M-16 30 L16 8 L-16 -14 M0 -34 L0 34"
          fill="none" stroke="#7DD3FC" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
